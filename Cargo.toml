[package]
name = "spellcast"
version = "0.1.0"
edition = "2024"
description = "Dictation-first terminal keyboard multiplexer for Linux"
license = "Apache-2.0"
authors = ["Panos"]
repository = "https://github.com/dark5un/spellcast"
keywords = ["dictation", "speech", "terminal", "multiplexer", "voice"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"

# Audio
cpal = "0.18"

# ASR
whisper-rs = { version = "0.16", default-features = false, optional = true }

# LLM (optional — only for explain feature)
mistralrs = { version = "0.8", optional = true }

# Terminal
portable-pty = "0.9"
ratatui = "0.30"
crossterm = "0.29"

# Database
rusqlite = { version = "0.40", features = ["bundled"] }

# Phonetic
rphonetic = "3.0"

# Web
ureq = "3"

# Tree-sitter for AST-aware tokenization (optional)
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "*", optional = true }
tree-sitter-go = { version = "*", optional = true }
tree-sitter-python = { version = "*", optional = true }
tree-sitter-javascript = { version = "*", optional = true }
tree-sitter-typescript = { version = "*", optional = true }
tree-sitter-c = { version = "*", optional = true }
tree-sitter-cpp = { version = "*", optional = true }
tree-sitter-java = { version = "*", optional = true }
tree-sitter-bash = { version = "*", optional = true }
tree-sitter-markdown = { version = "*", optional = true }
tree-sitter-json = { version = "*", optional = true }
tree-sitter-toml = { version = "*", optional = true }
tree-sitter-yaml = { version = "*", optional = true }
tree-sitter-html = { version = "*", optional = true }
tree-sitter-css = { version = "*", optional = true }
tree-sitter-sql = { version = "*", optional = true }
sha2 = "0.10"
hex = "0.4"
regex = "1"
shellexpand = "3"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = { version = "0.6", features = ["html_reports"] }

[features]
default = ["cpu"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
cpu = ["whisper-rs"]
llm = ["mistralrs"]
tree-sitter = [
    "dep:tree-sitter", "tree-sitter-rust", "tree-sitter-go", "tree-sitter-python",
    "tree-sitter-javascript", "tree-sitter-typescript",
    "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-java",
    "tree-sitter-bash", "tree-sitter-markdown", "tree-sitter-json",
    "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-html",
    "tree-sitter-css", "tree-sitter-sql",
]

# Enable ASR for tests even without CUDA
test-asr = ["whisper-rs"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
debug = true

[[bench]]
name = "asr_latency"
path = "tests/benches/asr_latency.rs"
harness = false

[[bench]]
name = "tokenize"
path = "tests/benches/tokenize.rs"
harness = false