[package]
name = "voxkey"
version = "0.1.0"
edition = "2024"
description = "Dictation-first terminal keyboard multiplexer for Linux"
license = "Apache-2.0"
authors = ["Panos"]
repository = "https://github.com/voxkey/voxkey"
keywords = ["dictation", "speech", "terminal", "multiplexer", "voice"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"

# Audio
cpal = "0.18"

# ASR
whisper-rs = { version = "0.16", default-features = false, optional = true }

# LLM (optional — only for explain feature)
mistralrs = { version = "0.8", optional = true }

# Terminal
portable-pty = "0.9"
ratatui = "0.30"
crossterm = "0.29"

# Database
rusqlite = { version = "0.40", features = ["bundled"] }

# Phonetic
rphonetic = "3.0"

# Web
ureq = "3"

# Utilities
sha2 = "0.10"
hex = "0.4"
regex = "1"
shellexpand = "3"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = { version = "0.6", features = ["html_reports"] }

[features]
default = ["cpu"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
cpu = ["whisper-rs"]
llm = ["mistralrs"]

# Enable ASR for tests even without CUDA
test-asr = ["whisper-rs"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
debug = true

[[bench]]
name = "asr_latency"
path = "tests/benches/asr_latency.rs"
harness = false

[[bench]]
name = "tokenize"
path = "tests/benches/tokenize.rs"
harness = false