[package]
name = "spellcast"
version = "0.1.0"
edition = "2024"
description = "Dictation-first terminal keyboard multiplexer for Linux"
license = "Apache-2.0"
authors = ["Panos"]
repository = "https://github.com/dark5un/spellcastv1"
keywords = ["dictation", "speech", "terminal", "multiplexer", "voice"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"

# Terminal
portable-pty = "0.9"
crossterm = "0.29"

# Database
rusqlite = { version = "0.40", features = ["bundled"] }

# Phonetic
rphonetic = "3.0"

# Web
ureq = "3"

# Tree-sitter for AST-aware tokenization
tree-sitter = "0.26"
tree-sitter-rust = "*"
tree-sitter-go = "*"
tree-sitter-python = "*"
tree-sitter-javascript = "*"
tree-sitter-typescript = "*"
tree-sitter-c = "*"
tree-sitter-cpp = "*"
tree-sitter-java = "*"
tree-sitter-bash = "*"
tree-sitter-json = "*"
tree-sitter-yaml = "*"
tree-sitter-html = "*"
tree-sitter-css = "*"
sha2 = "0.10"
hex = "0.4"
regex = "1"
shellexpand = "3"
ctrlc = "3.4"
libc = "0.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-sequel = "0.3.11"
tree-sitter-md-025 = "0.5.6"
silero = "0.6.0"
mistralrs = "0.8.1"
whisper-rs = "0.16.0"
cpal = { version = "0.18.1", features = ["pipewire"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = { version = "0.6", features = ["html_reports"] }

[features]
# GPU backends are compile-time capabilities (require SDK at build time)
# The runtime choice of which backend to use is a config/CLI option
cuda = []
vulkan = []
cpu = []
default = ["cuda"]
